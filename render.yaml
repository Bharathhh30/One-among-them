services:
  - type: web
    name: one-among-them-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: TYPESAFE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
